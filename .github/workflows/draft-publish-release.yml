name: Release Drafter and Publisher
on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
permissions:
  contents: write
  pull-requests: write
jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Update draft release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository (for publish check)
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Publish if merged PR with 'Publish' label
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if the latest commit is a PR merge commit
            const commit = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            const message = commit.data.message;
            const prMatch = message.match(/Merge pull request #(\d+) from/);
            if (!prMatch) {
              console.log('Not a PR merge commit. Skipping publish.');
              return;
            }
            const prNumber = prMatch[1];

            // Get the PR details
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            if (!pr.data.merged) {
              console.log('PR not merged. Skipping publish.');
              return;
            }
            const hasPublishLabel = pr.data.labels.some(label => label.name === 'Publish');
            if (!hasPublishLabel) {
              console.log('PR lacks "Publish" label. Skipping publish.');
              return;
            }

            // Find and publish the draft
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const draft = releases.data.find(r => r.draft);
            if (!draft) {
              core.setFailed("No draft release found to publish.");
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draft.id,
              draft: false
            });
            console.log(`✅ Draft release "${draft.tag_name}" published!`);
